<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protótipo · Importar Anki</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="#baralhos">← Baralhos</a><span>MEMORIZATION</span></header><section id="selecao"><p class="eyebrow">BARALHOS</p><h1>Importar do Anki</h1><p>Traga seus cartões para o Memorization em poucos passos.</p><label class="drop">＋<strong>Escolha um arquivo .apkg</strong><small>Até 4 MiB · arquivos de coleção não são aceitos</small><input id="arquivo" type="file" accept=".apkg"></label><p id="erro" role="alert"></p></section><section id="previa" hidden><div class="top"><div><p class="eyebrow">PRÉVIA DA IMPORTAÇÃO</p><h1 id="titulo"></h1></div><button id="editar-titulo">Editar título</button></div><p class="notice">ⓘ Alguns cartões contêm HTML ou mídia. O texto será preservado; mídias não serão importadas.</p><article><div class="row modified"><span class="pill altered">Modificado</span><label>Frente<input value="O que é repetição espaçada?"></label><label>Verso<textarea>Uma técnica de estudo que revisa o conteúdo em intervalos crescentes.</textarea></label><button>Editar</button></div><div class="row"><span class="pill added">Adicionado</span><label>Frente<input value="Como estudar vocabulário?"></label><label>Verso<textarea>Revise e use cada palavra em uma frase.</textarea></label><button>Editar</button></div></article><footer><button class="ghost" onclick="location.hash='#baralhos'">Cancelar</button><button class="primary" id="confirmar">Confirmar importação</button></footer></section></main><script src="app.js"></script></body></html>
