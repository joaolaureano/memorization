# CI: portões de qualidade a cada push e pull request (constituição, Princípio X).
# Três jobs independentes e paralelos; nenhum usa segredo nem acessa a AWS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segredos:
    name: Segredos (gitleaks, histórico inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  backend:
    name: Backend (typecheck, lint, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Os testes de PostgreSQL usam embedded-postgres: sem serviço externo.
      - run: npm test
      # A bateria do Adapter S3 das Imagens (026) contra um S3 compatível de
      # teste (SeaweedFS). As credenciais são geradas no próprio job, nunca
      # versionadas, e morrem com ele.
      - name: Armazém de Imagens contra S3 de teste
        run: |
          usuario="teste$RANDOM"
          senha="$(openssl rand -hex 16)"
          mkdir -p "$RUNNER_TEMP/s3"
          printf '{"identities":[{"name":"teste","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
            "$usuario" "$senha" > "$RUNNER_TEMP/s3/s3.json"
          docker run -d --name s3-teste -p 8333:8333 -v "$RUNNER_TEMP/s3:/etc/s3conf" \
            chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/s3conf/s3.json -volume.max=200
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8333 && break
            sleep 1
          done
          S3_DE_TESTE_ENDERECO=http://localhost:8333 \
          S3_DE_TESTE_USUARIO="$usuario" \
          S3_DE_TESTE_SENHA="$senha" \
          S3_DE_TESTE_RECUSA_ENVIO_GRANDE=sim \
            npx vitest run tests/imagens/armazem-s3.test.ts

  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
